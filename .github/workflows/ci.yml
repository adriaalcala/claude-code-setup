name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    env:
      # Pinned rather than apt's: shellcheck renumbers diagnostics between
      # releases (the unreachable-function check is SC2329 in 0.11 and SC2317
      # in 0.9), so an unpinned runner disagrees with local runs.
      SHELLCHECK_VERSION: v0.11.0
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck ${{ env.SHELLCHECK_VERSION }}
        run: |
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" \
            | tar -xJf - --strip-components=1 -C /usr/local/bin "shellcheck-${SHELLCHECK_VERSION}/shellcheck"
          shellcheck --version

      - name: Lint hooks and test runner
        run: |
          shellcheck -x -S style \
            hooks/scripts/*.sh \
            hooks/scripts/lib/*.sh \
            tests/hooks/run-tests.sh \
            skills/browser-uat/scripts/chrome-debug.sh

  hook-tests:
    name: hook contract tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS matters here: its BSD regex engine rejects the GNU \s, \d and \b
        # extensions, which is exactly how the original hooks stopped matching.
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Check jq is available
        run: jq --version

      - name: Run hook contract tests
        run: bash tests/hooks/run-tests.sh

  json-valid:
    name: validate JSON
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse every JSON file except the deliberately malformed fixture
        run: |
          status=0
          while IFS= read -r f; do
            case "$f" in
              ./tests/hooks/fixtures/malformed.json) continue ;;
            esac
            if ! jq -e . "$f" >/dev/null 2>&1; then
              echo "invalid JSON: $f"
              status=1
            fi
          done < <(find . -name '*.json' -not -path './.git/*')
          exit $status

      - name: The malformed fixture must stay malformed
        run: |
          if jq -e . tests/hooks/fixtures/malformed.json >/dev/null 2>&1; then
            echo "malformed.json parsed successfully; the fail-closed test is no longer meaningful"
            exit 1
          fi

  frontmatter:
    name: validate agent frontmatter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: No stale model IDs or invented tool names
        run: |
          status=0
          if grep -rn 'claude-opus-4\|claude-3-\|claude-sonnet-4' agents skills commands 2>/dev/null; then
            echo "stale model identifier found; use the opus/sonnet/haiku aliases"
            status=1
          fi
          if grep -rn 'claude-fetch\|claude-search\|claude-list-files\|claude-read\|claude-write\|claude-edit' \
             agents skills commands 2>/dev/null; then
            echo "invented tool name found; use Read/Write/Edit/Grep/Glob/Bash/WebFetch/Task"
            status=1
          fi
          exit $status
